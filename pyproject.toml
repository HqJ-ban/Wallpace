[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpace"
version = "0.1.0"
description = "桌面壁纸自动切换器 — Windows 小工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6.0",
    "watchdog>=3.0.0",
]

[project.scripts]
wallpace = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
